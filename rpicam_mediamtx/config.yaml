name: Raspberry Pi Camera (MediaMTX)
version: "0.1.0"
slug: rpicam_mediamtx
description: Streams the Raspberry Pi CSI camera over RTSP via MediaMTX and libcamera
url: https://github.com/thundo/ha-rpicam-mediamtx
arch:
  - aarch64
startup: services
boot: auto
# libcamera needs /dev/media*, /dev/v4l-subdev*, /dev/video* and /dev/dma_heap,
# and run.sh must remount /dev/shm: both require a privileged container.
full_access: true
apparmor: false
udev: true
video: true
ports:
  8554/tcp: null
ports_description:
  8554/tcp: RTSP. Home Assistant does not need it; set a port only to reach the stream from the LAN.
