name: Raspberry Pi Camera (MediaMTX)
version: "0.3.0"
slug: rpicam_mediamtx
description: Live stream from the Pi's CSI camera (libcamera + hardware H.264), ready for go2rtc
url: https://github.com/thundo/ha-rpicam-mediamtx
arch:
  - aarch64
stage: experimental
startup: services
boot: auto
# `video` covers /dev/video*, /dev/v4l-subdev* (major 81), /dev/media* and vchiq.
# mtxrpicam also allocates frame buffers from a DMA heap, which `video` does not cover;
# it tries vidbuf_cached first, then linux,cma. Paths absent on the host are skipped.
video: true
devices:
  - /dev/dma_heap/vidbuf_cached
  - /dev/dma_heap/linux,cma
udev: true
apparmor: false
options:
  resolution: "1920x1080"
  fps: 15
  bitrate: 5000
  hflip: false
  vflip: false
  timestamp: false
  log_level: info
  moq: false
# The `?` ones are image tuning and credentials: unset means MediaMTX's default,
# and the UI keeps them under "Show unused optional configuration options".
schema:
  # Presets only: the Pi 4 hardware H.264 encoder stops at 1920x1080, and anything
  # above falls back to software encoding on the CPU that runs Home Assistant.
  resolution: list(640x480|1280x720|1640x1232|1920x1080)
  fps: int(1,30)
  bitrate: int(500,20000)
  hflip: bool
  vflip: bool
  timestamp: bool
  brightness: float(-1,1)?
  contrast: float(0,16)?
  saturation: float(0,16)?
  sharpness: float(0,16)?
  ev: float(-10,10)?
  awb: list(auto|incandescent|tungsten|fluorescent|indoor|daylight|cloudy)?
  exposure: list(normal|short|long)?
  denoise: list(off|cdn_off|cdn_fast|cdn_hq)?
  flicker: list(off|50hz|60hz)?
  rtsp_username: str?
  rtsp_password: password?
  log_level: list(error|warn|info|debug)
  moq: bool
ports:
  8554/tcp: null
  8892/tcp: null
  8892/udp: null
  8893/udp: null
ports_description:
  8554/tcp: RTSP. Home Assistant does not need it; set a port only to reach the stream from the LAN.
  8892/tcp: MoQ web client (HTTP/2). Used only with the MoQ option on.
  8892/udp: MoQ WebTransport (HTTP/3). Used only with the MoQ option on.
  8893/udp: MoQ native QUIC. Used only with the MoQ option on.
