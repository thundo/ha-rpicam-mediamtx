# RTSP only: Home Assistant's go2rtc pulls the stream and serves WebRTC itself.
rtsp: true
rtspTransports: [tcp]
rtmp: false
hls: false
webrtc: false
srt: false
# MoQ is on by default since 1.21. Off here; the add-on's `moq` option turns it on (MTX_MOQ).
moq: false

# The default config lets anyone publish to any path. Here the only thing
# anyone can do is read the camera. The rtsp_username/rtsp_password options
# replace this anonymous user with a named one (same permission).
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: cam

# Resolution, frame rate, flips, encoding and image tuning come from the add-on
# options, which run.sh passes as MTX_PATHS_CAM_RPICAMERA* overrides.
paths:
  cam:
    source: rpiCamera
